<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أسرة 5 و 6 — كنيسة مارمينا بشبرا</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3fafb;--c:#fff;--t:#1f2a33;--m:#6b7b86;--b:#d5e6ea;--a:#128a9a;--o:#f39a1e;--pk:#ef5a7a;--ok:#2e7d4f;--bad:#d63a3a;--wr:#c97a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1d21;--c:#172a30;--t:#eaf4f6;--m:#9db4bb;--b:#27424a;--a:#3fc1d2;--ok:#5fc08a;--bad:#ff7a7a;--wr:#f5b84a}}
:root[data-theme="dark"]{--bg:#0f1d21;--c:#172a30;--t:#eaf4f6;--m:#9db4bb;--b:#27424a;--a:#3fc1d2;--ok:#5fc08a;--bad:#ff7a7a;--wr:#f5b84a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif;max-width:860px;margin-inline:auto;padding:0 12px 24px}
header{background:linear-gradient(135deg,#128a9a,#1aa7b8);color:#fff;border-radius:0 0 28px 28px;padding:16px 14px 18px;margin:0 -12px 12px;text-align:center;position:relative;overflow:hidden;border-bottom:5px solid var(--o)}
header:before,header:after{content:"✝";position:absolute;top:10px;font-size:26px;opacity:.25}header:before{right:16px}header:after{left:16px}
.logo{width:96px;height:96px;border-radius:50%;background:#fff;border:4px solid var(--o);display:block;margin:0 auto 6px;box-shadow:0 4px 14px #0004}
header h1{margin:2px 0 0;font-size:21px}header .s{font-size:14px;opacity:.95}
.verse{font-size:12.5px;background:#ffffff26;display:inline-block;border-radius:99px;padding:2px 14px;margin-top:8px}
h3{margin:6px 0;color:var(--a)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
button,select,input{font:inherit;padding:8px 10px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t)}
button{cursor:pointer}button.p{background:var(--o);color:#fff;border-color:var(--o);font-weight:600}
nav button{border-radius:99px;flex:1}nav button.on{background:var(--a);color:#fff;border-color:var(--a)}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:12px;margin-bottom:10px;border-inline-start:5px solid var(--a)}
.card.al{border-inline-start-color:var(--pk)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.row>*{flex:1;min-width:110px}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;margin:2px;border:1px solid var(--wr)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wr{color:var(--wr)}.m{color:var(--m);font-size:13px}
.ov{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--b);padding:6px;text-align:start}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.g label{font-size:12px;color:var(--m);display:block}.g select,.g input{width:100%}.g input[type=checkbox]{width:auto;vertical-align:middle;margin-inline-end:4px}.g label{color:var(--t)}
footer{text-align:center;color:var(--m);font-size:12px;margin-top:14px}
</style></head><body>

const R={1:"الحضور",2:"التحضير",3:"اشتراك المسابقة",4:"درجات المسابقة",5:"المخالفات والتعامل",6:"الافتقاد"};
const K={viol:"مخالفة",exc:"اعتذار مسبق",stage:"مرحلة إجراء"};const VV=["زيارة منزلية","خدمة فردية","اتصال تليفوني","رسائل على الموبايل"];const VT=["عنف","تلامس","إهانة","إفشاء أسرار المخدومين","تنمر","عدم الطاعة"];
const KN={sun:"اجتماع الأولاد",srv:"اجتماع الخدام",prep:"التحضير",quiz:"المسابقة",visit:"الافتقاد",...K};
const ST={p:"حاضر",l:"متأخر",e:"انصرف بدري",a:"غايب",x:"معتذر"},ST3=["","تنبيه","جلسة مع المسؤول","إيقاف مؤقت / إعادة تقييم"];
const AX=[["الحضور","«لِكُلِّ شَيْءٍ زَمَانٌ، وَلِكُلِّ أَمْرٍ تَحْتَ السَّمَاوَاتِ وَقْتٌ»","الجامعة ٣ : ١"],["التحضير","«اِجْتَهِدْ أَنْ تُقِيمَ نَفْسَكَ لِلَّهِ مُزَكًّى، عَامِلًا لاَ يُخْزَى، مُفَصِّلًا كَلِمَةَ الْحَقِّ بِالاسْتِقَامَةِ»","٢ تيموثاوس ٢ : ١٥"],["التلمذة والتعليم","«لاَحِظْ نَفْسَكَ وَالتَّعْلِيمَ، وَدَاوِمْ عَلَى ذلِكَ، لأَنَّكَ إِذَا فَعَلْتَ هذَا تُخَلِّصُ نَفْسَكَ وَالَّذِينَ يَسْمَعُونَكَ أَيْضًا.»","١ تيموثاوس ٤ : ١٦"],["التعامل مع المخدومين والافتقاد","«الْحَقَّ أَقُولُ لَكُمْ: بِمَا أَنَّكُمْ فَعَلْتُمْ بِأَحَدِ إِخْوَتِي هؤُلاَءِ الأَصَاغِرِ، فَبِي فَعَلْتُمْ.»","متى ٢٥ : ٤٠"]];
const axHtml=()=>`<details class="card" style="border-inline-start-color:var(--o)"><summary><b>✝ محاور اللايحة وآياتها</b></summary>${AX.map(([t,v,r])=>`<div style="margin-top:8px"><b>${t}</b><div class="m">${v} — ${r}</div></div>`).join("")}</details>`;
const iso=d=>d.toLocaleDateString("en-CA"),add=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};
const sun0=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+2)%7));return iso(d)};
let db,user,leader=false,uid=null,S=[],RC=[],tab="dash",wk=sun0(),ym=wk.slice(0,7),mode="w";
const $=s=>document.querySelector(s),h=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
var rt="sun",qm="p",rf=ym+"-01",rto=iso(new Date());
const pm=m=>d=>d.startsWith(m),pw=w=>d=>d>=w&&d<=add(w,6);
function stats(s,P,rc,week){
  const r=rc.filter(x=>x.sid===s.id&&P(x.d)),ex=n=>s.all||(s.ex||[]).includes(n),
  exc=r.filter(x=>x.k==="exc").map(x=>[+x.v,x.d]),exm=n=>exc.some(e=>e[0]===n),
  ses=r.filter(x=>(x.k==="sun"||x.k==="srv")&&x.v!=="x"&&!exc.some(e=>e[0]===1&&pw(x.d)(e[1]))),
  ab=ses.filter(x=>x.v==="a").length,ap=r.filter(x=>(x.k==="sun"||x.k==="srv")&&x.v==="x").length,lt=ses.filter(x=>x.v==="l").length,er=ses.filter(x=>x.v==="e").length,
  pr=r.filter(x=>x.k==="prep"),qz=r.filter(x=>x.k==="quiz"),qj=qz.filter(x=>+x.v>=0),
  avg=qj.length?qj.reduce((a,x)=>a+ +x.v,0)/qj.length:null,
  vi=r.filter(x=>x.k==="visit").length,vl=r.filter(x=>x.k==="viol"),f=[];
  if(!ex(1)&&!exm(1)){if(ses.length&&ab/ses.length>.5)f.push([1,"غياب "+Math.round(ab/ses.length*100)+"% (أكتر من 50%)",1]);
    if(!week){if(lt>1)f.push([1,"تأخير "+lt+" مرات (المسموح مرة في الشهر)"]);if(er>1)f.push([1,"انصراف بدري "+er+" مرات (المسموح مرة في الشهر)"])}}
  if(!ex(2)&&!exm(2)&&pr.some(x=>+x.v===0))f.push([2,"لم يسلّم التحضير في ميعاد الأربعاء "+pr.filter(x=>+x.v===0).length+" مرة"]);
  if(!ex(3)&&!exm(3)&&qz.length&&qj.length/qz.length<.75)f.push([3,"اشتراك "+Math.round(qj.length/qz.length*100)+"% (المطلوب 75%)"]);
  if(!ex(4)&&!exm(4)&&avg!==null&&avg<50)f.push([4,"متوسط الدرجات "+Math.round(avg)+"% (المطلوب 50%)"]);
  if(!ex(5)&&vl.length)f.push([5,vl.length+" مخالفة: "+vl.map(x=>(x.vt||"")+(x.vc?" ("+x.vc+")":"")||x.n||"").join("، "),1]);
  if(!week&&!ex(6)&&!exm(6)&&!vi)f.push([6,"لا يوجد افتقاد هذا الشهر"]);
  return{f,ses:ses.length,ap,ab,lt,er,pr:pr.length,qz:qz.length,qj:qj.length,avg,vi,stage:Math.max(0,...rc.filter(x=>x.sid===s.id&&x.k==="stage").map(x=>+x.v))}
}
const months=(sid,rc)=>[...new Set([ym,...rc.filter(x=>x.sid===sid).map(x=>x.d.slice(0,7))])].sort().reverse().slice(0,6);
function val(x){return x.k==="sun"||x.k==="srv"?ST[x.v]:x.k==="prep"?(+x.v?"سلّم في الميعاد":"لم يسلّم/متأخر"):x.k==="quiz"?(+x.v<0?"لم يشترك":(x.sc!=null?x.sc+"/"+x.tt+" = ":"")+x.v+"%"):x.k==="exc"?"قاعدة: "+R[x.v]:x.k==="stage"?ST3[x.v]:x.k==="visit"?"تم"+(x.ty?" — "+x.ty:""):(x.vt||"مسجّلة")+(x.vc?" — المخدوم: "+x.vc:"")}
function repHtml(s,P,label,rc,week,wlog){const t=stats(s,P,rc,week);
  const wl=wlog?[...new Set(rc.filter(x=>x.sid===s.id&&P(x.d)).map(x=>x.d))].sort().map(d=>`<div class="m">📅 ${d}: ${rc.filter(x=>x.sid===s.id&&x.d===d).map(x=>KN[x.k]+" — "+val(x)).join(" · ")}</div>`).join(""):"";
  return `<div class="card ${t.f.some(x=>x[2])?"al":""}"><b>${h(s.name)}</b> <span class="m">${label}${s.all?" — مُستثنى":""}</span>
  <div class="m">اجتماعات: ${t.ses} (غياب ${t.ab}، معتذر ${t.ap}، تأخير ${t.lt}، انصراف ${t.er}) · تحضير: ${t.pr} · مسابقات: ${t.qj}/${t.qz}${t.avg!==null?" (متوسط "+Math.round(t.avg)+"%)":""} · افتقاد: ${t.vi}</div>
  ${t.f.length?t.f.map(x=>`<div class="${x[2]?"bad":"wr"}">⚠ ${R[x[0]]}: ${h(x[1])}</div>`).join(""):'<div class="ok">✓ ملتزم بالقواعد</div>'}
  ${t.stage?`<div class="m">آخر مرحلة مسجلة: ${ST3[t.stage]}</div>`:""}${wl}</div>`}
async function sync(){
  for(const s of S.filter(s=>s.uid)){const rc=RC.filter(x=>x.sid===s.id);
    try{await db.doc("reports/"+s.uid).set({name:s.name,j:JSON.stringify({s,rc,ms:months(s.id,RC)})})}catch(e){}}}
const wbar=()=>`<div class="row"><button onclick="wk=add(wk,-7);draw()">▶ الأسبوع السابق</button><b style="text-align:center">أسبوع الجمعة ${wk}</b><button onclick="wk=add(wk,7);draw()">الأسبوع التالي ◀</button></div>`;

const HASH="f0a640fa4a580430f061f41135e76ef19413e1c9546e7a6ff96f12ad6bdc5e84";
async function doLogin(){const u=$("#lu").value.trim().toLowerCase(),p=$("#lp").value,b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(u+"|"+p)),hx=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
 if(hx===HASH){try{sessionStorage.setItem("ok","1")}catch(e){}entered=true;init()}else $("#lm").textContent="اسم المستخدم أو كلمة المرور غلط"}
function login(){const A=$("#app");A.className="";A.innerHTML=`<div class="card" style="text-align:center;border-inline-start-color:var(--o)"><h3>صفحة الدخول</h3><div>${leader?"أهلاً بيك يا أمين الخدمة 👋<div class='m'>حسابك له كل صلاحيات الإضافة والتعديل والحذف.</div>":"أهلاً بيك يا خادم 👋<div class='m'>هتشوف تقريرك الشخصي بس.</div>"}</div>${leader?`<div class="row"><input id="lu" placeholder="User Name" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password"></div><button class="p" style="margin-top:6px;width:100%" onclick="doLogin()">دخول</button><div id="lm" class="bad m"></div>`:`<button class="p" style="margin-top:10px;width:100%" onclick="entered=true;init()">دخول</button>`}${leader?`<div class="m" style="margin-top:10px">عشان تضيف أمين تاني: من زر المشاركة في claude.ai ادعيه بصلاحية «Contributor».</div>`:""}</div>`}
async function init(){
  const A=$("#app");
  try{user=await claude.use("user");db=await claude.use("db")}catch(e){}
  if(!db||!user){A.textContent="لازم تفتح الصفحة وإنت مسجّل دخول على claude.ai بحساب تمت مشاركة الصفحة معاه. اطلب من أمين الخدمة يشاركها معاك.";return}
  uid=await user.id();leader=!!(await user.can("data.write"));
  if(leader){
    db.collection("servants").onSnapshot(q=>{S=q.docs.map(d=>({id:d.id,...d.data()}));if(tab!=="week")draw();else if(!$("[data-sid]"))draw()});
    db.collection("records").onSnapshot(q=>{RC=q.docs.map(d=>({id:d.id,...d.data()}));if(tab!=="week")draw();else if(!$("[data-sid]"))draw()});
  }else{
    A.className="";A.innerHTML=`<div class="card"><b>تقريري</b><div class="m">رقم حسابك (ابعته للأمين عشان يربط تقريرك): <code>${h(uid)}</code></div></div><div id="rep" class="m">جاري تحميل تقريرك…</div>`;
    db.doc("reports/"+uid).onSnapshot(d=>{const r=$("#rep");if(!d.exists){r.textContent="لسه مفيش تقرير مربوط بحسابك.";return}
      const o=JSON.parse(d.data().j);r.className="";r.innerHTML=o.ms.map(m=>repHtml(o.s,pm(m),m,o.rc,false,true)).join("")},()=>{$("#rep").textContent="مش قادر أقرأ التقرير."})
  }
}
window.__ready.then(init);
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,addDoc,setDoc,updateDoc,deleteDoc,getDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// ===== الصق إعدادات Firebase هنا (من Project settings > Your apps) =====
const firebaseConfig={apiKey:"PASTE_API_KEY",authDomain:"PASTE_AUTH_DOMAIN",projectId:"PASTE_PROJECT_ID",appId:"PASTE_APP_ID"};
// =======================================================================
const A=document.getElementById("app"),g=i=>document.getElementById(i);
if(firebaseConfig.apiKey.startsWith("PASTE")){A.className="";A.innerHTML='<div class="card bad">لسه ما لصقتش إعدادات Firebase (firebaseConfig) في ملف index.html.</div>'}
else{
 const app=initializeApp(firebaseConfig),auth=getAuth(app),fs=getFirestore(app);let leader=false;
 g("lo").onclick=async e=>{e.preventDefault();try{await signOut(auth)}catch(x){}location.reload()};
 const dbs={collection:n=>({onSnapshot:(cb,er)=>onSnapshot(collection(fs,n),s=>cb({docs:s.docs}),er),add:o=>addDoc(collection(fs,n),o)}),
  doc:p=>({set:o=>setDoc(doc(fs,p),o),update:o=>updateDoc(doc(fs,p),o),delete:()=>deleteDoc(doc(fs,p)),
   onSnapshot:(cb,er)=>onSnapshot(doc(fs,p),s=>cb({exists:s.exists(),data:()=>s.data()}),er)})};
 const dl={save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data]));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}};
 const showLogin=()=>{A.className="";A.innerHTML=`<div class="card" style="text-align:center;border-inline-start-color:var(--o)"><h3>تسجيل الدخول</h3><div class="row"><input id="fe" type="email" placeholder="الإيميل" autocomplete="username"><input id="fp" type="password" placeholder="كلمة المرور" autocomplete="current-password"></div><button class="p" id="fb" style="width:100%">دخول</button><div id="fm" class="bad m"></div></div>`;
  const go=async()=>{try{await signInWithEmailAndPassword(auth,g("fe").value.trim(),g("fp").value)}catch(e){g("fm").textContent="الإيميل أو كلمة المرور غلط"}};
  g("fb").onclick=go;g("fp").onkeydown=e=>{if(e.key==="Enter")go()}};
 onAuthStateChanged(auth,async u=>{
  if(!u){showLogin();return}
  try{leader=(await getDoc(doc(fs,"leaders",u.uid))).exists()}catch(e){leader=false}
  window.claude={use:async n=>n==="db"?dbs:n==="user"?{id:async()=>u.uid,can:async()=>leader}:n==="downloads"?dl:null};
  window.__res();
 });
}
</script>
