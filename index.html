<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff7e6;--c:#fff;--t:#1f2a33;--m:#6b7b86;--b:#ffe0b8;--a:#0ea5b7;--o:#ff8a2b;--pk:#ff5c8a;--pu:#7b5cff;--y:#ffc93c;--ok:#1f9d63;--bad:#d63a3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1d21;--c:#172a30;--t:#eaf4f6;--m:#9db4bb;--b:#27424a;--a:#3fc1d2;--ok:#5fc08a;--bad:#ff7a7a}}
:root[data-theme="dark"]{--bg:#0f1d21;--c:#172a30;--t:#eaf4f6;--m:#9db4bb;--b:#27424a;--a:#3fc1d2;--ok:#5fc08a;--bad:#ff7a7a}
*,*::before,*::after{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif;max-width:860px;margin-inline:auto;padding:0 12px 28px}
header{background:linear-gradient(135deg,#0ea5b7,#4f8cff 55%,#ff5c8a);color:#fff;border-radius:0 0 32px 32px;padding:18px 14px;margin:0 -12px 12px;text-align:center;border-bottom:6px solid var(--y)}
.logo{width:150px;height:150px;border-radius:50%;background:#fff;border:5px solid var(--y);display:block;margin:0 auto 6px;box-shadow:0 6px 18px #0003}
header h1{margin:2px 0;font-size:22px}header .s{font-size:13px;opacity:.95}
nav{display:flex;gap:6px;margin-bottom:10px}
button,select,input{font:inherit;padding:9px 11px;border:1px solid var(--b);border-radius:12px;background:var(--c);color:var(--t);min-width:0}
button{cursor:pointer}button.p{background:var(--o);color:#fff;border-color:var(--o);font-weight:700}button.g{background:var(--a);color:#fff;border-color:var(--a)}
nav button{flex:1;border-radius:99px}nav button.on{background:var(--a);color:#fff;border-color:var(--a)}
.card{background:var(--c);border:1px solid var(--b);border-radius:18px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.row>*{flex:1;min-width:110px}
.m{color:var(--m);font-size:13px}.av{width:105px;height:140px;border-radius:14px;object-fit:cover;border:4px solid var(--y);display:block;margin:0 auto 8px;background:#fff}.av.s{width:40px;height:52px;border-radius:8px;border-width:2px;margin:0}.chip{display:inline-block;background:var(--b);border-radius:99px;padding:1px 9px;margin:2px;font-size:12px}.bad{color:var(--bad)}.ok{color:var(--ok)}
.bal{background:linear-gradient(135deg,#ff8a2b,#ff5c8a 55%,#7b5cff);color:#fff;border-radius:22px;padding:16px;text-align:center;box-shadow:0 6px 18px #0002}
.bal b{font-size:40px;display:block}.bal .m{color:#ffffffcc}
.kid{display:flex;justify-content:space-between;align-items:center;cursor:pointer}.kid b.n{color:var(--a)}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--b);padding:6px;text-align:start}.ov{overflow-x:auto}
.cc{width:340px;max-width:100%;margin:8px auto;border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,#128a9a 0%,#1aa7b8 55%,#ef5a7a 100%);box-shadow:0 8px 22px #0003;position:relative}
.cc .lg{display:flex;align-items:center;gap:8px;font-weight:700}.cc .lg img{width:42px;height:42px;border-radius:50%;border:2px solid var(--o);background:#fff}
.cc .no{letter-spacing:3px;font-size:20px;margin:14px 0 4px;direction:ltr;text-align:start}.cc .qr{background:#fff;border-radius:12px;padding:8px;width:fit-content;margin:8px auto 0}
.cc .chip{width:40px;height:30px;border-radius:7px;background:var(--y);margin-top:10px}
@media print{body *{visibility:hidden}#card,#card *{visibility:visible}#card{position:absolute;inset-inline-start:0;top:0}}
footer{text-align:center;color:var(--m);font-size:12px;margin-top:14px}

async function upX(){const f=$("#xf").files[0],set=t=>{um=t;const e=$("#um");if(e)e.innerHTML=t};
 if(!f){set("اختار ملف الأول");return}if(typeof XLSX==="undefined"){set("مكتبة Excel مش متاحة دلوقتي");return}
 try{set("جاري الإضافة…");const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""}),nz=s=>String(s).replace(/[أإآ]/g,"ا").replace(/\s+/g," ").trim(),fm2={};FAM.forEach(x=>fm2[nz(x)]=x);
  const seen=new Set([...K.map(k=>k.no),...K.map(k=>k.id)]),bad=[];let add=0,skip=0;
  for(let i=0;i<rows.length;i++){const r=rows[i],id=String(r[1]??"").trim().toUpperCase(),nm=String(r[2]??"").trim(),fa=fm2[nz(r[3]??"")];
   if(i===0&&/^id$/i.test(String(r[1]).trim()))continue;if(!id&&!nm&&!String(r[3]??"").trim())continue;
   if(!id||!nm||!fa||!/^[A-Z0-9]+$/.test(id)){bad.push("صف "+(i+1)+": "+(!id?"ID ناقص":!nm?"الاسم ناقص":!fa?"الأسرة غلط أو ناقصة":"ID فيه رموز غير مسموحة (أرقام وحروف إنجليزي بس)"));continue}
   if(seen.has(id)){skip++;continue}seen.add(id);
   await db.doc("kids/"+id).set({name:nm,no:id,fam:fa,ph:"",tk:mk()});add++;syncKid(id)}
  set("تم: إضافة "+add+" حساب جديد"+(skip?" — وتخطّي "+skip+" ID موجود قبل كده":"")+(bad.length?"<br>صفوف اتجاهلت ("+bad.length+"):<br>"+bad.slice(0,8).map(h).join("<br>")+(bad.length>8?"<br>…":""):""))}
 catch(e){set("تعذّر قراءة الملف أو مش مسموح لك بالإضافة")}}
function rs(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const W=150,H=200,c=document.createElement("canvas"),k=Math.max(W/i.width,H/i.height),w=W/k,hh=H/k;c.width=W;c.height=H;c.getContext("2d").drawImage(i,(i.width-w)/2,(i.height-hh)/2,w,hh,0,0,W,H);r(c.toDataURL("image/jpeg",.75))};i.src=URL.createObjectURL(f)})}
async function pickPh(e){if(!e.files[0])return;photo=await rs(e.files[0]);const p=$("#pp");p.src=photo;p.hidden=false}
async function setPh(e){if(!e.files[0])return;const p=await rs(e.files[0]);try{await db.doc("kids/"+cur).update({ph:p});syncKid(cur)}catch(x){msg="مش مسموح لك";draw()}}
